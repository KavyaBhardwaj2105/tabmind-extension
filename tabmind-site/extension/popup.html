<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TabMind</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><div class="logo">🧠</div><div><strong>TabMind</strong><span>Focus settings</span></div></header>
  <main>
    <label class="row"><span><b>Show intention pill</b><small>Keep your reason visible on pages.</small></span><input id="showPill" type="checkbox"></label>
    <label class="row"><span><b>Show timer</b><small>Track time spent on the current page.</small></span><input id="showTimer" type="checkbox"></label>
    <label class="row"><span><b>30-minute check-in</b><small>Ask for a focus check after this many seconds.</small></span><input id="triggerSeconds" class="number" type="number" min="10" max="7200" step="5"></label>
    <label class="row"><span><b>Browser notifications</b><small>Keep disabled by default; the in-page prompt is the main trigger.</small></span><input id="notifications" type="checkbox"></label>
    <label class="slider"><span><b>Pill opacity</b><output id="opacityValue">94%</output></span><input id="opacity" type="range" min="0.45" max="1" step="0.01"></label>
    <button id="openNewTab" class="button">Open TabMind new tab</button>
  </main>
  <script src="popup.js"></script>
</body></html>
